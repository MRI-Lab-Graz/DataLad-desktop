name: Smoke Cross Platform

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        node:
          - '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Windows: datalad-installer's git-annex installer updates the persistent
      # system PATH itself, so later steps see it.
      - name: Install DataLad + git-annex (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          python -m pip install datalad-installer datalad
          datalad-installer --sudo ok -E "${{ runner.temp }}/dl-env.sh" git-annex -m datalad/packages

      # macOS runners are Apple silicon. datalad-installer's git-annex there is
      # an Intel-only dmg that first installs Rosetta, a step that preceded
      # silent job deaths in CI. Homebrew's arm64 bottle is native and lands on
      # PATH; --force-bottle fails fast instead of compiling from source.
      - name: Install DataLad + git-annex (macOS, native)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          brew install --force-bottle git-annex
          python -m pip install datalad

      - name: Run unit smoke tests
        run: npm test

      - name: Run UI e2e tests (real Electron window)
        run: npm run test:e2e

      - name: Run packaging smoke build (unpacked)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dir
