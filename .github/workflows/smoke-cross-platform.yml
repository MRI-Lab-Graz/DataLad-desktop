name: Smoke Cross Platform

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        node:
          - '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install DataLad + git-annex
        run: |
          python -m pip install datalad-installer datalad
          datalad-installer --sudo ok -E "${{ runner.temp }}/dl-env.sh" git-annex -m datalad/packages

      # On Windows, git-annex's own installer updates the persistent system
      # PATH directly, so later steps see it for free. On macOS (and Linux,
      # if this matrix grows one), datalad-installer just copies
      # git-annex.app into place and writes the PATH change to a local
      # shell script instead - each workflow step is a fresh shell, so
      # without this, `git-annex`/`datalad` are on disk but invisible to
      # every step after this one.
      - name: Add git-annex to PATH (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source "${{ runner.temp }}/dl-env.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Run unit smoke tests
        run: npm test

      - name: Run UI e2e tests (real Electron window)
        run: npm run test:e2e

      - name: Run packaging smoke build (unpacked)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:dir
