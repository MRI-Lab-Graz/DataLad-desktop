name: Rust Bridge Validation

on:
  push:
    branches:
      - main
    paths:
      - 'rust-core/**'
      - 'native/**'
      - 'src/datalad/**'
      - 'test/rust-bridge.test.js'
      - 'test/adapter-parity.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rust-bridge-validation.yml'
  pull_request:
    paths:
      - 'rust-core/**'
      - 'native/**'
      - 'src/datalad/**'
      - 'test/rust-bridge.test.js'
      - 'test/adapter-parity.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rust-bridge-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Rust Adapter Path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install root dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust core tests
        run: npm run test:rust:core

      - name: Run Rust addon tests
        run: npm run test:rust:addon

      - name: Build Rust addon
        run: npm run build:rust:addon

      - name: Run bridge tests
        run: npm run test:bridge

      - name: Run adapter parity tests
        run: npm run test:parity

      - name: Write validation summary
        if: always()
        run: |
          echo "## Rust Bridge Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node tests: npm test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust core: npm run test:rust:core" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust addon: npm run test:rust:addon" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust build: npm run build:rust:addon" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bridge tests: npm run test:bridge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Parity tests: npm run test:parity" >> "$GITHUB_STEP_SUMMARY"
