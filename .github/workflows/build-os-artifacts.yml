name: Build OS Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default; only the publish job below can write. Signing secrets are
# passed to the one step that needs them, never exported to the rest of the job.
permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    steps:
      # Signing/notarization is opt-in via the MACOS_SIGNING_ENABLED repo variable (there is no
      # certificate yet, so releases are currently unsigned and say so in the release notes).
      # To enable it set the variable to 'true' and add these repo secrets: MACOS_CSC_LINK
      # (base64-encoded .p12 developer ID certificate), MACOS_CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch bundled uv
        run: node scripts/fetch-uv.mjs aarch64-apple-darwin

      - name: Build macOS artifacts (signed and notarized)
        if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac:arm64 -- --publish=never

      # CSC_LINK must be unset (not empty) when not signing, hence two build steps.
      - name: Build macOS artifacts (unsigned test build)
        if: ${{ vars.MACOS_SIGNING_ENABLED != 'true' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac:arm64 -- --publish=never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalad-desktop-macos
          path: |
            dist/*.dmg
            dist/*-mac.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch bundled uv
        run: node scripts/fetch-uv.mjs x86_64-pc-windows-msvc

      - name: Build Windows artifacts
        run: npm run package:win:x64 -- --publish=never

      - name: Upload unsigned executables for signing
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-x64-for-signing
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows executables with SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
          project-slug: 'datalad-desktop'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist-signed'

      # When signing is on, both the installer and the portable exe must be signed; a signed
      # file with no unsigned twin means the signing configuration changed, so fail loudly.
      - name: Replace every executable with its signed version
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        run: |
          for signed in dist-signed/*.exe; do
            name=$(basename "$signed")
            [ -f "dist/$name" ] || { echo "::error::signed $name has no unsigned twin in dist/"; exit 1; }
            cp "$signed" "dist/$name"
          done

      # The script install (scripts/windows/install.ps1) downloads this zip from the tag's release and checks it
      # against the SHA-256 rendered into its own copy of the script, so the tag has to match the package version.
      - name: Zip the unpacked app and render the install script
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Tag $env:GITHUB_REF does not match the package.json version $version"
          }
          $zip = "dist/DataLad-Desktop-$version-win-x64.zip"
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath $zip
          node scripts/render-install-script.mjs $version $zip dist/install.ps1
          Copy-Item scripts/windows/install.cmd dist/install.cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalad-desktop-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/install.cmd
            dist/install.ps1
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch bundled uv
        run: node scripts/fetch-uv.mjs x86_64-unknown-linux-gnu

      - name: Build Linux artifacts
        run: npm run package:linux -- --publish=never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalad-desktop-linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
      - linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: datalad-desktop-*
          path: release-assets
          merge-multiple: true

      # Lets an IT department verify a downloaded file against what CI built.
      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          shopt -s nullglob
          sha256sum *.dmg *.zip *.exe *.AppImage *.cmd *.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.cmd
            release-assets/*.ps1

      # Be explicit about what users are getting: unsigned builds trigger OS warnings, so
      # tell them how to check the download against what CI built instead.
      - name: Describe signing status and how to verify
        run: |
          {
            echo "## Verify your download"
            echo
            if [ "${{ vars.MACOS_SIGNING_ENABLED }}" = 'true' ]; then
              echo "- macOS: signed and notarized."
            else
              echo "- macOS: **UNSIGNED**. Gatekeeper will warn; see the README for System Settings, Privacy and Security, Open Anyway."
            fi
            if [ "${{ vars.SIGNPATH_ENABLED }}" = 'true' ]; then
              echo "- Windows: signed."
            else
              echo "- Windows: **UNSIGNED**. SmartScreen will warn on first run."
            fi
            echo
            echo "Check the file you downloaded against what CI built:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo "gh attestation verify <downloaded file> --repo ${{ github.repository }}"
            echo '```'
          } > release-note.md
          cat release-note.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-note.md
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.cmd
            release-assets/*.ps1
            release-assets/SHA256SUMS.txt
