name: Build OS Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Read-only by default; only the publish job below can write. Signing secrets are
# passed to the one step that needs them, never exported to the rest of the job.
permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch bundled uv
        run: node scripts/fetch-uv.mjs aarch64-apple-darwin

      # Releases are unsigned (no certificate). The install script is the way in: a file fetched with curl is not
      # quarantined, so Gatekeeper never asks.
      - name: Build the macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac:arm64 -- --publish=never

      # The script install (scripts/macos/macos-install.sh) downloads this zip from the tag's release and checks it
      # against the SHA-256 rendered into its own copy of the script, so the tag has to match the package version.
      # ditto keeps the code signature and symlinks intact, which a plain zip would not.
      - name: Zip the app and render the install script
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag $GITHUB_REF does not match the package.json version $version"
            exit 1
          fi
          zip="dist/DataLad-Desktop-$version-mac-arm64.zip"
          ditto -c -k --keepParent "dist/mac-arm64/DataLad Desktop.app" "$zip"
          node scripts/render-install-script.mjs "$version" "$zip" dist/macos-install.sh scripts/macos/macos-install.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalad-desktop-macos
          path: |
            dist/DataLad-Desktop-*-mac-arm64.zip
            dist/macos-install.sh
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch bundled uv
        run: node scripts/fetch-uv.mjs x86_64-pc-windows-msvc

      - name: Build Windows artifacts
        run: npm run package:win:x64 -- --publish=never

      # The script install (scripts/windows/windows-install.cmd) downloads this zip from the tag's release and checks it
      # against the SHA-256 rendered into its own copy of the script, so the tag has to match the package version.
      - name: Zip the unpacked app and render the install script
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Tag $env:GITHUB_REF does not match the package.json version $version"
          }
          $zip = "dist/DataLad-Desktop-$version-win-x64.zip"
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath $zip
          node scripts/render-install-script.mjs $version $zip dist/windows-install.cmd scripts/windows/windows-install.cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalad-desktop-windows-x64
          path: |
            dist/DataLad-Desktop-*-win-x64.zip
            dist/windows-install.cmd
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch bundled uv
        run: node scripts/fetch-uv.mjs x86_64-unknown-linux-gnu

      - name: Build Linux artifacts
        run: npm run package:linux -- --publish=never

      # linux-install.sh downloads this AppImage from the tag's release and checks it against the SHA-256 rendered into
      # its own copy of the script, so the tag has to match the package version.
      - name: Render the install script
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag $GITHUB_REF does not match the package.json version $version"
            exit 1
          fi
          node scripts/render-install-script.mjs "$version" dist/*.AppImage dist/linux-install.sh scripts/linux/linux-install.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datalad-desktop-linux
          path: |
            dist/*.AppImage
            dist/linux-install.sh
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
      - linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: datalad-desktop-*
          path: release-assets
          merge-multiple: true

      # Lets an IT department verify a downloaded file against what CI built.
      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          shopt -s nullglob
          sha256sum *.zip *.AppImage *.cmd *.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.cmd
            release-assets/*.sh

      - name: Describe how to install and how to verify
        run: |
          {
            echo "## Install"
            echo
            echo "- **Windows:** download [windows-install.cmd](https://github.com/${{ github.repository }}/releases/latest/download/windows-install.cmd) and double-click it."
            echo "- **macOS (Apple silicon):** in Terminal run \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/macos-install.sh | bash\`"
            echo "- **Linux:** in a terminal run \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/linux-install.sh | bash\`"
            echo
            echo "Builds are not code-signed. The install scripts check the app against a SHA-256 written into the script itself."
            echo
            echo "## Verify your download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo "gh attestation verify <downloaded file> --repo ${{ github.repository }}"
            echo '```'
          } > release-note.md
          cat release-note.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-note.md
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.cmd
            release-assets/*.sh
            release-assets/SHA256SUMS.txt
