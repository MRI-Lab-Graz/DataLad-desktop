name: Build OS Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS (x64 + arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Signing/notarization is opt-in via the MACOS_SIGNING_ENABLED repo variable, mirroring the
      # Windows/SignPath gate below. To enable it, set that variable to 'true' and add these repo
      # secrets: MACOS_CSC_LINK (base64-encoded .p12 developer ID certificate), MACOS_CSC_KEY_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. electron-builder signs and notarizes
      # automatically once those are present — no other config is needed. Until then this step
      # produces the same unsigned build it always has.
      #
      # electron-builder treats CSC_LINK="" (empty string) as "a link was
      # provided", not as "unset" — it resolves the empty string to a path
      # and fails trying to import the project directory as a certificate
      # file. So when signing is disabled, these vars must be left entirely
      # unset (this step skipped) rather than set to ''.
      - name: Configure macOS signing env
        if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "CSC_LINK=${{ secrets.MACOS_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MACOS_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Build macOS artifacts (Intel + Apple Silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
        run: npm run package:mac:both -- --publish=never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datalad-desktop-macos
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml
            dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows artifacts
        run: npm run package:win:x64 -- --publish=never

      - name: Upload unsigned installer for signing
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: datalad-desktop-windows-x64-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer with SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
          project-slug: 'datalad-desktop'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist-signed'

      - name: Replace installer with signed artifact
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        run: |
          signed_exe=$(find dist-signed -name '*.exe' | head -n1)
          unsigned_exe=$(find dist -name '*.exe' | head -n1)
          cp "$signed_exe" "$unsigned_exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datalad-desktop-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux artifacts
        run: npm run package:linux -- --publish=never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datalad-desktop-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
      - linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: datalad-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.blockmap
            release-assets/**/*.AppImage
            release-assets/**/*.yml