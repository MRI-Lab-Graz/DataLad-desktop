name: Security Checks

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action now requires a paid license for
      # organization-owned repos; the underlying gitleaks CLI itself stays
      # free/open-source, so run it directly instead of through the action.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --config tests/gitleaks.toml --redact -v

  dependency-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        run: ./tests/npm-audit.sh
